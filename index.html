<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6年之约 · 六年打卡</title>
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --brand-50: #eff3ff;
  --brand-100: #dbe4ff;
  --brand-200: #bac8ff;
  --brand-300: #91a7ff;
  --brand-400: #748ffc;
  --brand-500: #5c7cfa;
  --brand-600: #4c6ef5;
  --brand-700: #4263eb;
  --brand-800: #3b5bdb;
  --brand-900: #364fc7;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
  --shadow: 0 1px 3px 0 rgba(0,0,0,.08),0 1px 2px -1px rgba(0,0,0,.08);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.07);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.06);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --nav-height: 56px;
  --max-w: 520px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app{
  width: 100%;
  max-width: var(--max-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* Navigation */
.nav{
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar{display:none}
.nav-brand{
  font-weight: 700;
  font-size: 15px;
  color: var(--brand-700);
  white-space: nowrap;
  padding: 6px 10px;
  margin-right: 4px;
  letter-spacing: 0.02em;
}
.nav-tabs{
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.nav-tab{
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s,color .15s;
  border: none;
  background: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.nav-tab:hover{background:var(--brand-50);color:var(--brand-700)}
.nav-tab:focus-visible{outline:2px solid var(--brand-400);outline-offset:-2px}
.nav-tab.active{
  background: var(--brand-100);
  color: var(--brand-700);
  font-weight: 600;
}

/* Main Content */
.main{
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.page{display:none;flex-direction:column;gap:14px}
.page.active{display:flex}

/* Card */
.card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow)}

/* Hero Card */
.hero-card{
  background: linear-gradient(135deg, var(--brand-700), var(--brand-900));
  color: #fff;
  border-radius: var(--radius-xl);
  padding: 28px 24px;
  position: relative;
  overflow: hidden;
}
.hero-card::after{
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 160px;
  height: 160px;
  background: rgba(255,255,255,.06);
  border-radius: 50%;
}
.hero-label{
  font-size: 12px;
  letter-spacing: .1em;
  opacity: .8;
  margin-bottom: 4px;
}
.hero-date{
  font-size: 28px;
  font-weight: 700;
  letter-spacing: .02em;
  margin-bottom: 2px;
}
.hero-slogan{
  font-size: 14px;
  opacity: .85;
  margin-bottom: 18px;
  letter-spacing: .03em;
}
.hero-countdown{
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.countdown-item{
  background: rgba(255,255,255,.12);
  border-radius: var(--radius);
  padding: 10px 14px;
  text-align: center;
  min-width: 52px;
  backdrop-filter: blur(4px);
}
.countdown-num{
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
}
.countdown-label{
  font-size: 11px;
  opacity: .7;
  margin-top: 2px;
}
.hero-progress{
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-progress-bar{
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,.2);
  overflow: hidden;
}
.hero-progress-fill{
  height: 100%;
  background: #fff;
  border-radius: 3px;
  transition: width .6s ease;
}
.hero-progress-text{
  font-size: 14px;
  font-weight: 600;
}

/* Stats Row */
.stats-row{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}
.stat-card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}
.stat-icon{font-size:20px;margin-bottom:4px}
.stat-value{font-size:20px;font-weight:700;color:var(--text-primary)}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Form Elements */
.form-group{margin-bottom:14px}
.form-label{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.mood-selector{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.mood-btn{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.mood-btn:hover{border-color:var(--brand-400);transform:scale(1.08)}
.mood-btn:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.mood-btn.selected{
  border-color: var(--brand-600);
  background: var(--brand-50);
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(76,110,245,.15);
}
.mood-tooltip{
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  z-index: 10;
}
.mood-btn:hover .mood-tooltip{opacity:1}
.mood-tooltip::after{
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 4px solid #1e293b;
}

textarea,input[type="text"],input[type="number"]{
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  background: var(--surface);
  color: var(--text-primary);
  transition: border-color .15s,box-shadow .15s;
  resize: vertical;
}
textarea:focus,input:focus{
  outline: none;
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(76,110,245,.1);
}
textarea{min-height:80px}
.char-count{text-align:right;font-size:11px;color:var(--text-muted);margin-top:2px}

.habit-group{display:flex;gap:10px;flex-wrap:wrap}
.habit-chip{
  padding: 8px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.habit-chip:hover{border-color:var(--brand-400)}
.habit-chip:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.habit-chip.checked{
  background: var(--brand-50);
  border-color: var(--brand-600);
  color: var(--brand-700);
  font-weight: 600;
}

.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: .01em;
}
.btn:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.btn-primary{
  background: var(--brand-700);
  color: #fff;
  width: 100%;
  padding: 14px;
  font-size: 15px;
}
.btn-primary:hover{background:var(--brand-800)}
.btn-primary:active{background:var(--brand-900);transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{
  padding: 7px 14px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}
.btn-outline{
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-secondary);
}
.btn-outline:hover{background:var(--brand-50);border-color:var(--brand-400);color:var(--brand-700)}

/* Progress page */
.progress-bar-wrap{
  height: 12px;
  background: var(--brand-50);
  border-radius: 6px;
  overflow: hidden;
  margin: 10px 0;
}
.progress-bar-fill{
  height: 100%;
  background: linear-gradient(90deg,var(--brand-500),var(--brand-700));
  border-radius: 6px;
  transition: width .6s ease;
}
.progress-stats{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-top: 6px;
}
.progress-stat{
  text-align: center;
}
.progress-stat-val{font-size:16px;font-weight:700;color:var(--text-primary)}
.progress-stat-lbl{font-size:11px;color:var(--text-muted)}

/* Heatmap */
.heatmap{
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  justify-content: flex-start;
}
.heatmap-cell{
  width: 13px;
  height: 13px;
  border-radius: 2px;
  background: var(--border);
  transition: background .2s;
}
.heatmap-cell.l1{background:#bac8ff}
.heatmap-cell.l2{background:#91a7ff}
.heatmap-cell.l3{background:#748ffc}
.heatmap-cell.l4{background:#5c7cfa}
.heatmap-legend{
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
}
.heatmap-legend span{width:13px;height:13px;border-radius:2px;display:inline-block;background:var(--border)}
.heatmap-legend span.l1{background:#bac8ff}
.heatmap-legend span.l2{background:#91a7ff}
.heatmap-legend span.l3{background:#748ffc}
.heatmap-legend span.l4{background:#5c7cfa}

/* Table */
.data-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th{
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid var(--border);
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 11px;
  letter-spacing: .03em;
}
.data-table td{
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}
.data-table tr:hover td{background:var(--brand-50)}

/* Diary */
.search-bar{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.search-input{
  flex: 1;
  min-width: 120px;
  position: relative;
}
.search-input input{
  padding-left: 36px;
}
.search-input::before{
  content: '🔍';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  z-index: 1;
  pointer-events: none;
}
.filter-select{
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--surface);
  color: var(--text-primary);
  cursor: pointer;
  font-family: inherit;
  appearance: auto;
}
.filter-select:focus{outline:none;border-color:var(--brand-500)}

.diary-card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: box-shadow .15s;
  border-left: 4px solid transparent;
}
.diary-card:hover{box-shadow:var(--shadow-md)}
.diary-card-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.diary-date{font-size:13px;font-weight:600;color:var(--text-primary)}
.diary-mood{font-size:20px}
.diary-deposit{font-size:12px;color:var(--text-secondary)}
.diary-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.diary-tag{
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  background: var(--brand-50);
  color: var(--brand-700);
}

/* Blueprint */
.bp-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.bp-title{font-size:15px;font-weight:700}
.bp-subtitle{font-size:12px;color:var(--text-muted)}
.bp-grid{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}
.bp-cell{
  aspect-ratio: 1;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  font-size:12px;
}
.bp-cell:hover{box-shadow:var(--shadow);border-color:var(--brand-300)}
.bp-cell:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.bp-cell.current{
  border-color: var(--success);
  background: #f0fdf4;
  box-shadow: 0 0 0 2px rgba(34,197,94,.15);
}
.bp-cell.future{
  opacity: .45;
  background: var(--bg);
  cursor: default;
}
.bp-cell .bp-month{font-weight:700;font-size:13px}
.bp-cell .bp-date{font-size:10px;color:var(--text-muted);margin-top:1px}
.bp-cell .bp-status{font-size:10px;margin-top:2px}
.bp-cell .bp-rate{font-size:10px;font-weight:600;color:var(--brand-700);margin-top:1px}

/* Toast */
.toast{
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 999;
  opacity: 0;
  transition: opacity .3s,transform .3s;
  pointer-events: none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}

/* Empty state */
.empty-state{
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state .empty-text{font-size:14px}

/* Responsive */
@media(max-width:400px){
  .hero-date{font-size:22px}
  .countdown-num{font-size:18px}
  .stats-row{gap:6px}
  .stat-card{padding:12px 8px}
  .stat-value{font-size:17px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f172a;
    --surface:#1e293b;
    --text-primary:#e2e8f0;
    --text-secondary:#94a3b8;
    --text-muted:#64748b;
    --border:#334155;
    --brand-50:#1e293b;
    --brand-100:#1e3a5f;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --shadow-md:0 4px 6px rgba(0,0,0,.4);
    --shadow-lg:0 10px 15px rgba(0,0,0,.5);
  }
  textarea,input[type="text"],input[type="number"],.filter-select{
    background:var(--surface);
    color:var(--text-primary);
  }
  .bp-cell.current{background:#0a2e1a}
  .habit-chip.checked{background:#1e3a5f}
}
</style>
</head>
<body>

<div class="app">
  <nav class="nav">
    <span class="nav-brand">6年之约</span>
    <div class="nav-tabs">
      <button class="nav-tab active" data-page="home">主页</button>
      <button class="nav-tab" data-page="checkin">每日打卡</button>
      <button class="nav-tab" data-page="progress">进度总览</button>
      <button class="nav-tab" data-page="diary">日记回顾</button>
      <button class="nav-tab" data-page="blueprint">六年蓝图</button>
    </div>
  </nav>

  <main class="main" id="mainContent"></main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Data Layer ──
const START_DATE = new Date('2026-05-28T00:00:00');
const TARGET_DATE = new Date('2032-05-28T00:00:00');
const TARGET_AMOUNT = 1000000;

function loadData(){
  const raw = localStorage.getItem('nianzhiyue_data');
  if(raw){
    try{return JSON.parse(raw)}catch(e){}
  }
  return {
    targetDeposit: 1000000,
    checkins: {},
    totalDeposit: 0,
    streak: 0,
    totalCount: 0
  };
}

function saveData(data){
  localStorage.setItem('nianzhiyue_data', JSON.stringify(data));
}

let appData = loadData();

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function formatMoney(n){return '¥'+Number(n).toLocaleString('zh-CN')}

// ── Router ──
let currentPage = 'home';
const mainEl = document.getElementById('mainContent');
const toastEl = document.getElementById('toast');

function showToast(msg, type=''){
  toastEl.textContent = msg;
  toastEl.className = 'toast '+type+' show';
  clearTimeout(toastEl._tid);
  toastEl._tid = setTimeout(()=>{toastEl.className='toast'},2000);
}

document.querySelectorAll('.nav-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentPage = tab.dataset.page;
    renderPage();
  });
});

function renderPage(){
  switch(currentPage){
    case 'home': renderHome(); break;
    case 'checkin': renderCheckin(); break;
    case 'progress': renderProgress(); break;
    case 'diary': renderDiary(); break;
    case 'blueprint': renderBlueprint(); break;
  }
}

// ── Home Page ──
function renderHome(){
  const now = new Date();
  const totalMs = TARGET_DATE - START_DATE;
  const elapsedMs = now - START_DATE;
  const progress = Math.min(100, Math.max(0, (elapsedMs / totalMs) * 100));
  const diffMs = TARGET_DATE - now;
  const diffDays = Math.max(0, Math.floor(diffMs / 86400000));
  const diffHours = Math.max(0, Math.floor((diffMs % 86400000) / 3600000));
  const diffMins = Math.max(0, Math.floor((diffMs % 3600000) / 60000));
  const diffSecs = Math.max(0, Math.floor((diffMs % 60000) / 1000));
  const years = Math.floor(diffDays / 365);
  const months = Math.floor((diffDays % 365) / 30);
  const days = diffDays % 30;

  mainEl.innerHTML = `
    <div class="hero-card">
      <div class="hero-label">倒计时</div>
      <div class="hero-date">2032.05.28</div>
      <div class="hero-slogan">每一天，都比昨天好一点点</div>
      <div class="hero-countdown">
        <div class="countdown-item"><div class="countdown-num">${years}</div><div class="countdown-label">年</div></div>
        <div class="countdown-item"><div class="countdown-num">${months}</div><div class="countdown-label">月</div></div>
        <div class="countdown-item"><div class="countdown-num">${days}</div><div class="countdown-label">天</div></div>
        <div class="countdown-item"><div class="countdown-num">${String(diffHours).padStart(2,'0')}</div><div class="countdown-label">时</div></div>
        <div class="countdown-item"><div class="countdown-num">${String(diffMins).padStart(2,'0')}</div><div class="countdown-label">分</div></div>
        <div class="countdown-item"><div class="countdown-num">${String(diffSecs).padStart(2,'0')}</div><div class="countdown-label">秒</div></div>
      </div>
      <div class="hero-progress">
        <span style="font-size:12px">六年进度</span>
        <div class="hero-progress-bar"><div class="hero-progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
        <span class="hero-progress-text">${progress.toFixed(1)}%</span>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-value">${appData.streak}</div><div class="stat-label">连续打卡天数</div></div>
      <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value">${formatMoney(appData.totalDeposit)}</div><div class="stat-label">累计存款</div></div>
      <div class="stat-card"><div class="stat-icon">📝</div><div class="stat-value">${appData.totalCount}</div><div class="stat-label">累计打卡次数</div></div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text-muted);padding:20px 0">加油(ง •̀_•́)ง #六年之约</div>
  `;
}

// ── Checkin Page ──
let checkinMood = 3;
let checkinHabits = {sport:false,study:false};

function renderCheckin(){
  const today = todayStr();
  const existing = appData.checkins[today];
  const isChecked = !!existing;

  mainEl.innerHTML = `
    <div class="card">
      <div class="form-group">
        <div class="form-label">😊 今日心情</div>
        <div class="mood-selector" id="moodSelector">
          ${[
            {emoji:'😄',label:'超棒'},
            {emoji:'😊',label:'不错'},
            {emoji:'😐',label:'一般'},
            {emoji:'😔',label:'不太好'},
            {emoji:'😢',label:'难过'}
          ].map((item,i)=>`
            <button class="mood-btn ${(existing?existing.mood:3)===i+1?'selected':''}" data-mood="${i+1}" ${isChecked?'disabled':''}>
              ${item.emoji}
              <span class="mood-tooltip">${item.label}</span>
            </button>
          `).join('')}
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">🌟 一件开心/积极的事</div>
        <textarea id="happyInput" placeholder="今天发生了什么让你开心的事？学到了什么？有什么进步？" maxlength="500" ${isChecked?'disabled':''}>${existing?existing.happy:''}</textarea>
        <div class="char-count"><span id="happyCount">${existing?existing.happy.length:0}</span>/500</div>
      </div>
      <div class="form-group">
        <div class="form-label">💪 一件难过/挑战的事</div>
        <textarea id="toughInput" placeholder="今天遇到了什么困难？有什么不开心的事？" maxlength="500" ${isChecked?'disabled':''}>${existing?existing.tough:''}</textarea>
        <div class="char-count"><span id="toughCount">${existing?existing.tough.length:0}</span>/500</div>
      </div>
      <div class="form-group">
        <div class="form-label">💭 今日思考</div>
        <textarea id="thinkInput" placeholder="今天有什么感悟？有什么想法？" maxlength="500" ${isChecked?'disabled':''}>${existing?existing.think:''}</textarea>
        <div class="char-count"><span id="thinkCount">${existing?existing.think.length:0}</span>/500</div>
      </div>
      <div class="form-group">
        <div class="form-label">💰 当前累计存款(元)</div>
        <input type="number" id="depositInput" value="${existing?existing.deposit:appData.totalDeposit}" ${isChecked?'disabled':''}>
      </div>
      <div class="form-group">
        <div class="form-label">✅ 今日习惯</div>
        <div class="habit-group" id="habitGroup">
          <button class="habit-chip ${existing&&existing.habits.sport?'checked':''}" data-habit="sport" ${isChecked?'disabled':''}>🏃 运动了</button>
          <button class="habit-chip ${existing&&existing.habits.study?'checked':''}" data-habit="study" ${isChecked?'disabled':''}>📚 学习了</button>
        </div>
      </div>
      <button class="btn btn-primary" id="submitBtn" ${isChecked?'disabled':''}>${isChecked?'✅ 今日已打卡':'📝 完成今日打卡'}</button>
      ${isChecked?'<p style="text-align:center;color:var(--text-muted);font-size:12px;margin-top:8px">今日已完成打卡，明天再来吧</p>':''}
    </div>
  `;

  if(!isChecked){
    document.getElementById('moodSelector').addEventListener('click',function(e){
      const btn = e.target.closest('.mood-btn');
      if(!btn || btn.disabled) return;
      this.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      checkinMood = parseInt(btn.dataset.mood);
    });

    ['happy','tough','think'].forEach(id=>{
      const el = document.getElementById(id+'Input');
      const cnt = document.getElementById(id+'Count');
      el.addEventListener('input',()=>{cnt.textContent=el.value.length});
    });

    document.getElementById('habitGroup').addEventListener('click',function(e){
      const chip = e.target.closest('.habit-chip');
      if(!chip || chip.disabled) return;
      chip.classList.toggle('checked');
      checkinHabits[chip.dataset.habit] = chip.classList.contains('checked');
    });

    document.getElementById('submitBtn').addEventListener('click',submitCheckin);
  }
}

function submitCheckin(){
  const today = todayStr();
  const happy = document.getElementById('happyInput').value.trim();
  const tough = document.getElementById('toughInput').value.trim();
  const think = document.getElementById('thinkInput').value.trim();
  const deposit = parseInt(document.getElementById('depositInput').value) || 0;

  appData.checkins[today] = {
    mood: checkinMood,
    happy,
    tough,
    think,
    deposit,
    habits: {...checkinHabits},
    timestamp: Date.now()
  };

  appData.totalDeposit = deposit;
  appData.totalCount = Object.keys(appData.checkins).length;

  // calc streak
  let streak = 0;
  const d = new Date();
  for(let i=0;i<1000;i++){
    const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(appData.checkins[s]){streak++}else break;
    d.setDate(d.getDate()-1);
  }
  appData.streak = streak;

  saveData(appData);
  showToast('✅ 打卡成功！','success');
  renderCheckin();
}

// ── Progress Page ──
function renderProgress(){
  const target = appData.targetDeposit;
  const current = appData.totalDeposit;
  const remaining = Math.max(0, target - current);
  const progressPct = Math.min(100, (current/target)*100);

  // remaining months
  const now = new Date();
  const remainMs = TARGET_DATE - now;
  const remainMonths = Math.max(1, Math.ceil(remainMs / (30*86400000)));
  const suggestedMonthly = Math.ceil(remaining / remainMonths);

  // heatmap: from START_DATE to today
  let heatmapCells = '';
  const hmStart = new Date(START_DATE);
  const hmEnd = new Date();
  const totalDays = Math.floor((hmEnd - hmStart) / 86400000) + 1;
  for(let i=0;i<totalDays;i++){
    const d = new Date(hmStart);
    d.setDate(d.getDate()+i);
    const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let lvl = 0;
    if(appData.checkins[s]){
      const c = appData.checkins[s];
      const words = (c.happy||'').length+(c.tough||'').length+(c.think||'').length;
      if(words>300) lvl=4;
      else if(words>200) lvl=3;
      else if(words>100) lvl=2;
      else lvl=1;
    }
    heatmapCells += `<div class="heatmap-cell${lvl?' l'+lvl:''}" title="${s}${lvl?' · 已打卡':''}"></div>`;
  }

  // monthly stats: from START_DATE to now
  let monthlyRows = '';
  const startMonth = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);
  const endMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const months = [];
  for(let m = new Date(endMonth); m >= startMonth; m.setMonth(m.getMonth()-1)){
    months.push(new Date(m));
  }
  for(const d of months){
    const yr = d.getFullYear();
    const mo = d.getMonth()+1;
    const daysInMonth = new Date(yr,mo,0).getDate();
    let checkedDays = 0;
    let monthEndDeposit = 0;
    for(let day=1;day<=daysInMonth;day++){
      const s = yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(appData.checkins[s]){checkedDays++;monthEndDeposit=appData.checkins[s].deposit}
    }
    const rate = daysInMonth>0?Math.round(checkedDays/daysInMonth*100):0;
    monthlyRows += `<tr><td>${yr}-${String(mo).padStart(2,'0')}</td><td>${checkedDays}/${daysInMonth}</td><td>${rate}%</td><td>${formatMoney(monthEndDeposit)}</td></tr>`;
  }

  mainEl.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="bp-title">💰 存款进度 · 目标</span>
        <button class="btn btn-sm btn-outline" onclick="adjustTarget()">⚙ 调整目标</button>
      </div>
      <div style="font-size:26px;font-weight:700;color:var(--brand-700);margin-top:8px">${formatMoney(target)}</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${progressPct}%"></div>
      </div>
      <div class="progress-stats">
        <div class="progress-stat"><div class="progress-stat-val">${formatMoney(current)}</div><div class="progress-stat-lbl">当前存款</div></div>
        <div class="progress-stat"><div class="progress-stat-val">${formatMoney(remaining)}</div><div class="progress-stat-lbl">距离目标</div></div>
        <div class="progress-stat"><div class="progress-stat-val">${formatMoney(suggestedMonthly)}</div><div class="progress-stat-lbl">建议月存</div></div>
      </div>
    </div>

    <div class="card">
      <div class="bp-title">📅 打卡热力图</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">${hmStart.getFullYear()}/${hmStart.getMonth()+1}/${hmStart.getDate()} - ${hmEnd.getFullYear()}/${hmEnd.getMonth()+1}/${hmEnd.getDate()}</div>
      <div class="heatmap">${heatmapCells}</div>
      <div class="heatmap-legend">
        少 <span></span><span class="l1"></span><span class="l2"></span><span class="l3"></span><span class="l4"></span> 多
      </div>
    </div>

    <div class="card">
      <div class="bp-title">📊 月度统计</div>
      <div style="overflow-x:auto;margin-top:10px">
        <table class="data-table">
          <thead><tr><th>月份</th><th>打卡天数</th><th>打卡率</th><th>月末存款</th></tr></thead>
          <tbody>${monthlyRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function adjustTarget(){
  const val = prompt('请输入新的存款目标金额：', appData.targetDeposit);
  if(val && !isNaN(val) && parseInt(val)>0){
    appData.targetDeposit = parseInt(val);
    saveData(appData);
    renderProgress();
    showToast('目标已更新','success');
  }
}

// ── Diary Page ──
let diaryFilter = {search:'',mood:'all',month:'all'};

function renderDiary(){
  const entries = Object.entries(appData.checkins).sort((a,b)=>b[0].localeCompare(a[0]));
  const allMonths = [...new Set(entries.map(([k])=>k.substring(0,7)))];

  const filtered = entries.filter(([date,data])=>{
    if(diaryFilter.search){
      const s = diaryFilter.search.toLowerCase();
      if(!data.happy.toLowerCase().includes(s) && !data.tough.toLowerCase().includes(s) && !data.think.toLowerCase().includes(s)) return false;
    }
    if(diaryFilter.mood!=='all' && data.mood!==parseInt(diaryFilter.mood)) return false;
    if(diaryFilter.month!=='all' && !date.startsWith(diaryFilter.month)) return false;
    return true;
  });

  const moodLabels = {'1':'😄 超棒','2':'😊 不错','3':'😐 一般','4':'😔 不太好','5':'😢 难过'};
  const moodEmojis = {'1':'😄','2':'😊','3':'😐','4':'😔','5':'😢'};

  mainEl.innerHTML = `
    <div class="card">
      <div class="search-bar">
        <div class="search-input">
          <input type="text" placeholder="搜索日记内容..." value="${diaryFilter.search}" id="diarySearch">
        </div>
        <select class="filter-select" id="moodFilter">
          <option value="all" ${diaryFilter.mood==='all'?'selected':''}>全部心情</option>
          ${Object.entries(moodLabels).map(([k,v])=>`<option value="${k}" ${diaryFilter.mood===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <select class="filter-select" id="monthFilter">
          <option value="all" ${diaryFilter.month==='all'?'selected':''}>全部月份</option>
          ${allMonths.map(m=>`<option value="${m}" ${diaryFilter.month===m?'selected':''}>${m}</option>`).join('')}
        </select>
        <button class="btn btn-sm btn-outline" onclick="exportData()">📤 导出数据</button>
      </div>
    </div>

    ${filtered.length===0?`
      <div class="card">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">还没有打卡记录，快去打卡吧</div>
        </div>
      </div>
    `:filtered.map(([date,data])=>`
      <div class="diary-card" onclick="viewDiaryDetail('${date}')">
        <div class="diary-card-header">
          <span class="diary-date">${date}</span>
          <span class="diary-mood">${moodEmojis[data.mood]||'😐'}</span>
        </div>
        <div class="diary-deposit">💰 ${formatMoney(data.deposit)}</div>
        <div class="diary-tags">
          ${data.happy?'<span class="diary-tag">🌟 开心事</span>':''}
          ${data.tough?'<span class="diary-tag">💪 挑战</span>':''}
          ${data.think?'<span class="diary-tag">💭 思考</span>':''}
          ${data.habits.sport?'<span class="diary-tag">🏃 运动</span>':''}
          ${data.habits.study?'<span class="diary-tag">📚 学习</span>':''}
        </div>
      </div>
    `).join('')}
  `;

  document.getElementById('diarySearch').addEventListener('input',function(){
    diaryFilter.search = this.value;
    renderDiary();
  });
  document.getElementById('moodFilter').addEventListener('change',function(){
    diaryFilter.mood = this.value;
    renderDiary();
  });
  document.getElementById('monthFilter').addEventListener('change',function(){
    diaryFilter.month = this.value;
    renderDiary();
  });
}

function viewDiaryDetail(date){
  const data = appData.checkins[date];
  if(!data) return;
  const moodLabels = {'1':'😄 超棒','2':'😊 不错','3':'😐 一般','4':'😔 不太好','5':'😢 难过'};
  mainEl.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <button class="btn btn-sm btn-outline" onclick="renderDiary()" style="margin-bottom:12px">← 返回列表</button>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:18px;font-weight:700">${date}</span>
        <span style="font-size:24px">${moodLabels[data.mood]||'😐'}</span>
      </div>
      <div style="margin-top:14px">💰 存款：<strong>${formatMoney(data.deposit)}</strong></div>
      ${data.happy?`<div style="margin-top:14px"><div class="form-label">🌟 一件开心/积极的事</div><p style="font-size:14px;color:var(--text-primary);line-height:1.8">${escapeHtml(data.happy)}</p></div>`:''}
      ${data.tough?`<div style="margin-top:14px"><div class="form-label">💪 一件难过/挑战的事</div><p style="font-size:14px;color:var(--text-primary);line-height:1.8">${escapeHtml(data.tough)}</p></div>`:''}
      ${data.think?`<div style="margin-top:14px"><div class="form-label">💭 今日思考</div><p style="font-size:14px;color:var(--text-primary);line-height:1.8">${escapeHtml(data.think)}</p></div>`:''}
      <div style="margin-top:14px">
        <div class="form-label">✅ 今日习惯</div>
        <div class="habit-group">
          <span class="habit-chip ${data.habits.sport?'checked':''}" style="pointer-events:none">🏃 运动了</span>
          <span class="habit-chip ${data.habits.study?'checked':''}" style="pointer-events:none">📚 学习了</span>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function exportData(){
  const json = JSON.stringify(appData,null,2);
  const blob = new Blob([json],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '年之约_打卡数据_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出','success');
}

// ── Blueprint Page ──
function renderBlueprint(){
  const startDate = new Date('2026-05-01');
  let cells = '';
  const today = todayStr();

  for(let i=1;i<=72;i++){
    const monthDate = new Date(startDate);
    monthDate.setMonth(monthDate.getMonth()+i-1);
    const mStr = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0');
    const isCurrentMonth = today.startsWith(mStr);
    const isFuture = monthDate > new Date();

    let status = '', rate = '';
    if(isFuture){status='待开启'}
    else if(isCurrentMonth){
      const daysInMonth = new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
      let cnt = 0;
      for(let d=1;d<=daysInMonth;d++){
        const s = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(appData.checkins[s]) cnt++;
      }
      const pct = Math.round(cnt/daysInMonth*100);
      status = cnt+'天打卡';
      rate = pct+'%';
    } else {
      const daysInMonth = new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
      let cnt = 0;
      for(let d=1;d<=daysInMonth;d++){
        const s = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(appData.checkins[s]) cnt++;
      }
      const pct = Math.round(cnt/daysInMonth*100);
      status = cnt+'天打卡';
      rate = pct+'%';
    }

    cells += `
      <div class="bp-cell ${isCurrentMonth?'current':''} ${isFuture?'future':''}" title="M${i} · ${monthDate.getFullYear()}.${String(monthDate.getMonth()+1).padStart(2,'0')}">
        <div class="bp-month">M${i}</div>
        <div class="bp-date">${monthDate.getFullYear()}.${String(monthDate.getMonth()+1).padStart(2,'0')}</div>
        <div class="bp-status">${status}</div>
        ${rate?`<div class="bp-rate">${rate}</div>`:''}
      </div>
    `;
  }

  mainEl.innerHTML = `
    <div class="card">
      <div class="bp-header">
        <div>
          <div class="bp-title">📅 72个月 · 六年蓝图</div>
          <div class="bp-subtitle">每个格子代表一个月</div>
        </div>
      </div>
      <div class="bp-grid">${cells}</div>
    </div>
  `;
}

setInterval(()=>{
  if(currentPage==='home') renderHome();
