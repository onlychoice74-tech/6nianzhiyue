<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>6年之约 · 六年打卡</title>
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --brand-50: #eff3ff;
  --brand-100: #dbe4ff;
  --brand-200: #bac8ff;
  --brand-300: #91a7ff;
  --brand-400: #748ffc;
  --brand-500: #5c7cfa;
  --brand-600: #4c6ef5;
  --brand-700: #4263eb;
  --brand-800: #3b5bdb;
  --brand-900: #364fc7;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,.05);
  --shadow: 0 1px 3px 0 rgba(0,0,0,.08),0 1px 2px -1px rgba(0,0,0,.08);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.07);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.06);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --nav-height: 56px;
  --max-w: 520px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.app{
  width: 100%;
  max-width: var(--max-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* Navigation */
.nav{
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar{display:none}
.nav-brand{
  font-weight: 700;
  font-size: 15px;
  color: var(--brand-700);
  white-space: nowrap;
  padding: 6px 10px;
  margin-right: 4px;
  letter-spacing: 0.02em;
}
.nav-tabs{
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.nav-tab{
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s,color .15s;
  border: none;
  background: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.nav-tab:hover{background:var(--brand-50);color:var(--brand-700)}
.nav-tab:focus-visible{outline:2px solid var(--brand-400);outline-offset:-2px}
.nav-tab.active{
  background: var(--brand-100);
  color: var(--brand-700);
  font-weight: 600;
}

/* Main Content */
.main{
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.page{display:none;flex-direction:column;gap:14px}
.page.active{display:flex}

/* Card */
.card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow)}

/* Hero Card */
.hero-card{
  border-radius: var(--radius-xl);
  padding: 28px 24px;
  position: relative;
  overflow: hidden;
  color: #fff;
  transition: background .4s ease;
}
.hero-card::after{
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 160px;
  height: 160px;
  background: rgba(255,255,255,.06);
  border-radius: 50%;
}
.hero-label{
  font-size: 12px;
  letter-spacing: .1em;
  opacity: .8;
  margin-bottom: 4px;
}
.hero-date{
  font-size: 28px;
  font-weight: 700;
  letter-spacing: .02em;
  margin-bottom: 2px;
}
.hero-slogan{
  font-size: 14px;
  opacity: .85;
  margin-bottom: 18px;
  letter-spacing: .03em;
}
.hero-countdown{
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.countdown-item{
  background: rgba(255,255,255,.12);
  border-radius: var(--radius);
  padding: 10px 14px;
  text-align: center;
  min-width: 52px;
  backdrop-filter: blur(4px);
}
.countdown-num{
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
}
.countdown-label{
  font-size: 11px;
  opacity: .7;
  margin-top: 2px;
}
.hero-progress{
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hero-progress-bar{
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: rgba(255,255,255,.2);
  overflow: hidden;
}
.hero-progress-fill{
  height: 100%;
  background: #fff;
  border-radius: 3px;
  transition: width .6s ease;
}
.hero-progress-text{
  font-size: 14px;
  font-weight: 600;
}

/* Settings gear */
.settings-trigger{
  position: absolute;
  top: 12px;
  right: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
  transition: background .15s,transform .3s;
  -webkit-tap-highlight-color: transparent;
}
.settings-trigger:hover{background:rgba(255,255,255,.25)}
.settings-trigger:focus-visible{outline:2px solid #fff;outline-offset:2px}
.settings-trigger.open{transform:rotate(90deg)}

/* Settings Panel */
.settings-panel{
  display: none;
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-md);
  flex-direction: column;
  gap: 16px;
  animation: slideDown .25s ease-out;
}
.settings-panel.open{display:flex}
@keyframes slideDown{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
.settings-title{
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.settings-row{
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.settings-row label{
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 60px;
}
.settings-row input[type="number"]{
  width: 80px;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
  text-align: center;
}
.settings-row input[type="number"]:focus{
  outline: none;
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(76,110,245,.1);
}
.settings-row input[type="color"]{
  width: 40px;
  height: 36px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  padding: 2px;
}
.settings-row input[type="text"]{
  flex: 1;
  min-width: 120px;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: inherit;
}
.settings-row input[type="text"]:focus{
  outline: none;
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(76,110,245,.1);
}
.slogan-presets{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.slogan-preset{
  padding: 6px 12px;
  border-radius: 16px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.slogan-preset:hover{border-color:var(--brand-400);color:var(--brand-700)}
.slogan-preset:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.slogan-preset.active{
  background: var(--brand-50);
  border-color: var(--brand-600);
  color: var(--brand-700);
  font-weight: 600;
}
.toggle-switch{
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}
.toggle-switch input{
  opacity: 0;
  width: 0;
  height: 0;
}
.toggle-slider{
  position: absolute;
  cursor: pointer;
  top: 0;left: 0;right: 0;bottom: 0;
  background: var(--border);
  border-radius: 12px;
  transition: .2s;
}
.toggle-slider::before{
  content: '';
  position: absolute;
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: .2s;
}
.toggle-switch input:checked + .toggle-slider{background:var(--brand-600)}
.toggle-switch input:checked + .toggle-slider::before{transform:translateX(20px)}
.toggle-switch input:focus-visible + .toggle-slider{outline:2px solid var(--brand-400);outline-offset:2px}

/* Stats Row */
.stats-row{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
}
.stat-card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: default;
  position: relative;
}
.stat-card.clickable{cursor:pointer;transition:box-shadow .15s}
.stat-card.clickable:hover{box-shadow:var(--shadow-md)}
.stat-icon{font-size:20px;margin-bottom:4px}
.stat-value{font-size:20px;font-weight:700;color:var(--text-primary)}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.stat-hint{
  font-size: 10px;
  color: var(--brand-500);
  margin-top: 2px;
  opacity: .7;
}

/* Form Elements */
.form-group{margin-bottom:14px}
.form-label{
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.mood-selector{
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.mood-btn{
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.mood-btn:hover{border-color:var(--brand-400);transform:scale(1.08)}
.mood-btn:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.mood-btn.selected{
  border-color: var(--brand-600);
  background: var(--brand-50);
  transform: scale(1.12);
  box-shadow: 0 0 0 3px rgba(76,110,245,.15);
}
.mood-tooltip{
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  z-index: 10;
}
.mood-btn:hover .mood-tooltip{opacity:1}
.mood-tooltip::after{
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 4px solid #1e293b;
}

textarea,input[type="text"],input[type="number"]{
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  background: var(--surface);
  color: var(--text-primary);
  transition: border-color .15s,box-shadow .15s;
  resize: vertical;
}
textarea:focus,input:focus{
  outline: none;
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(76,110,245,.1);
}
textarea{min-height:80px}
.char-count{text-align:right;font-size:11px;color:var(--text-muted);margin-top:2px}

.habit-group{display:flex;gap:10px;flex-wrap:wrap}
.habit-chip{
  padding: 8px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 13px;
  cursor: pointer;
  transition: all .15s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.habit-chip:hover{border-color:var(--brand-400)}
.habit-chip:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.habit-chip.checked{
  background: var(--brand-50);
  border-color: var(--brand-600);
  color: var(--brand-700);
  font-weight: 600;
}

.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: .01em;
}
.btn:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.btn-primary{
  background: var(--brand-700);
  color: #fff;
  width: 100%;
  padding: 14px;
  font-size: 15px;
}
.btn-primary:hover{background:var(--brand-800)}
.btn-primary:active{background:var(--brand-900);transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{
  padding: 7px 14px;
  font-size: 12px;
  border-radius: var(--radius-sm);
}
.btn-outline{
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-secondary);
}
.btn-outline:hover{background:var(--brand-50);border-color:var(--brand-400);color:var(--brand-700)}

/* Progress page */
.progress-bar-wrap{
  height: 12px;
  background: var(--brand-50);
  border-radius: 6px;
  overflow: hidden;
  margin: 10px 0;
}
.progress-bar-fill{
  height: 100%;
  background: linear-gradient(90deg,var(--brand-500),var(--brand-700));
  border-radius: 6px;
  transition: width .6s ease;
}
.progress-stats{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-top: 6px;
}
.progress-stat{
  text-align: center;
}
.progress-stat-val{font-size:16px;font-weight:700;color:var(--text-primary)}
.progress-stat-lbl{font-size:11px;color:var(--text-muted)}

/* Heatmap */
.heatmap{
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  justify-content: flex-start;
}
.heatmap-cell{
  width: 13px;
  height: 13px;
  border-radius: 2px;
  background: var(--border);
  transition: background .2s;
}
.heatmap-cell.l1{background:#bac8ff}
.heatmap-cell.l2{background:#91a7ff}
.heatmap-cell.l3{background:#748ffc}
.heatmap-cell.l4{background:#5c7cfa}
.heatmap-legend{
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
}
.heatmap-legend span{width:13px;height:13px;border-radius:2px;display:inline-block;background:var(--border)}
.heatmap-legend span.l1{background:#bac8ff}
.heatmap-legend span.l2{background:#91a7ff}
.heatmap-legend span.l3{background:#748ffc}
.heatmap-legend span.l4{background:#5c7cfa}

/* Table */
.data-table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th{
  text-align: left;
  padding: 8px 10px;
  border-bottom: 2px solid var(--border);
  font-weight: 600;
  color: var(--text-secondary);
  font-size: 11px;
  letter-spacing: .03em;
}
.data-table td{
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}
.data-table tr:hover td{background:var(--brand-50)}

/* Diary */
.search-bar{
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.search-input{
  flex: 1;
  min-width: 120px;
  position: relative;
}
.search-input input{
  padding-left: 36px;
}
.search-input::before{
  content: '🔍';
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  z-index: 1;
  pointer-events: none;
}
.filter-select{
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: var(--surface);
  color: var(--text-primary);
  cursor: pointer;
  font-family: inherit;
  appearance: auto;
}
.filter-select:focus{outline:none;border-color:var(--brand-500)}

.diary-card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: box-shadow .15s;
  border-left: 4px solid transparent;
}
.diary-card:hover{box-shadow:var(--shadow-md)}
.diary-card-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.diary-date{font-size:13px;font-weight:600;color:var(--text-primary)}
.diary-mood{font-size:20px}
.diary-deposit{font-size:12px;color:var(--text-secondary)}
.diary-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.diary-tag{
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  background: var(--brand-50);
  color: var(--brand-700);
}

/* Blueprint */
.bp-header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.bp-title{font-size:15px;font-weight:700}
.bp-subtitle{font-size:12px;color:var(--text-muted)}
.bp-grid{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}
.bp-cell{
  aspect-ratio: 1;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1.5px solid var(--border);
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  font-size:12px;
}
.bp-cell:hover{box-shadow:var(--shadow);border-color:var(--brand-300)}
.bp-cell:focus-visible{outline:2px solid var(--brand-400);outline-offset:2px}
.bp-cell.current{
  border-color: var(--success);
  background: #f0fdf4;
  box-shadow: 0 0 0 2px rgba(34,197,94,.15);
}
.bp-cell.future{
  opacity: .45;
  background: var(--bg);
  cursor: default;
}
.bp-cell .bp-month{font-weight:700;font-size:13px}
.bp-cell .bp-date{font-size:10px;color:var(--text-muted);margin-top:1px}
.bp-cell .bp-status{font-size:10px;margin-top:2px}
.bp-cell .bp-rate{font-size:10px;font-weight:600;color:var(--brand-700);margin-top:1px}

/* Toast */
.toast{
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 999;
  opacity: 0;
  transition: opacity .3s,transform .3s;
  pointer-events: none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}

/* Empty state */
.empty-state{
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px}
.empty-state .empty-text{font-size:14px}

/* Footer */
.app-footer{
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  padding: 20px 0;
  cursor: pointer;
  transition: color .15s;
}
.app-footer:hover{color:var(--brand-500)}

/* Responsive */
@media(max-width:400px){
  .hero-date{font-size:22px}
  .countdown-num{font-size:18px}
  .stats-row{gap:6px}
  .stat-card{padding:12px 8px}
  .stat-value{font-size:17px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f172a;
    --surface:#1e293b;
    --text-primary:#e2e8f0;
    --text-secondary:#94a3b8;
    --text-muted:#64748b;
    --border:#334155;

<script>
// ── Version & Cache Check ──
const APP_VERSION = '2.0.0';
(function(){
  const cachedVer = localStorage.getItem('nianzhiyue_version');
  if(cachedVer && cachedVer !== APP_VERSION){
    // Version changed, clear stale cache and force reload
    localStorage.setItem('nianzhiyue_version', APP_VERSION);
    location.reload(true);
    return;
  }
  localStorage.setItem('nianzhiyue_version', APP_VERSION);
})();

// ── Supabase API (native fetch, zero external dependency) ──
const SUPABASE_URL = 'https://qnqldxoununafagxejum.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFucWxkeG91bnVuYWZhZ3hlanVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwOTI0NDIsImV4cCI6MjA5NTY2ODQ0Mn0.XHAB4piP_A6yatZouIKNmZWjdDBwDRzsW3ZTVFrjjso';
let accessToken = null;
let refreshToken = null;

async function supabaseFetch(path, options = {}) {
  const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers };
  if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
  try {
    const res = await fetch(SUPABASE_URL + path, { ...options, headers });
    if (res.status === 204) return { error: null };
    const data = await res.json();
    if (!res.ok) return { error: { message: data.msg || data.message || ('HTTP ' + res.status) } };
    return { data, error: null };
  } catch(e) {
    return { error: { message: '网络请求失败，请检查网络连接' } };
  }
}

function saveSession(token, refresh) {
  accessToken = token;
  refreshToken = refresh || null;
  if (token) {
    localStorage.setItem('nianzhiyue_token', token);
    if (refresh) localStorage.setItem('nianzhiyue_refresh', refresh);
  }
}

function clearSession() {
  accessToken = null;
  refreshToken = null;
  localStorage.removeItem('nianzhiyue_token');
  localStorage.removeItem('nianzhiyue_refresh');
}

// Load cached session on init
(function() {
  const t = localStorage.getItem('nianzhiyue_token');
  if (t) { accessToken = t; refreshToken = localStorage.getItem('nianzhiyue_refresh') || null; }
})();

const supabase = {
  auth: {
    async signInWithOtp({ email }) {
      return supabaseFetch('/auth/v1/otp', {
        method: 'POST',
        body: JSON.stringify({ email, create_user: true })
      });
    },
    async verifyOtp({ email, token, type }) {
      const result = await supabaseFetch('/auth/v1/verify', {
        method: 'POST',
        body: JSON.stringify({ email, token, type })
      });
      if (result.data && result.data.access_token) {
        saveSession(result.data.access_token, result.data.refresh_token);
        result.data.user = result.data.user || { id: result.data.user_id, email };
      }
      return result;
    },
    async signOut() {
      const result = await supabaseFetch('/auth/v1/logout', { method: 'POST' });
      clearSession();
      return result;
    },
    async getSession() {
      if (!accessToken) return { data: { session: null } };
      const result = await supabaseFetch('/auth/v1/user');
      if (result.error) {
        // Try refresh
        if (refreshToken) {
          const refreshResult = await supabaseFetch('/auth/v1/token?grant_type=refresh_token', {
            method: 'POST',
            body: JSON.stringify({ refresh_token: refreshToken })
          });
          if (!refreshResult.error && refreshResult.data && refreshResult.data.access_token) {
            saveSession(refreshResult.data.access_token, refreshResult.data.refresh_token);
            const retry = await supabaseFetch('/auth/v1/user');
            if (!retry.error && retry.data) return { data: { session: { user: retry.data } } };
          }
        }
        clearSession();
        return { data: { session: null } };
      }
      return { data: { session: { user: result.data } } };
    }
  },
  from(table) {
    const self = this;
    return {
      select(cols) {
        return {
          eq(field, value) {
            return {
              async single() {
                return supabaseFetch('/rest/v1/' + table + '?select=' + cols + '&' + field + '=eq.' + encodeURIComponent(value), {
                  headers: { 'Accept': 'application/vnd.pgrst.object+json' }
                });
              }
            };
          }
        };
      },
      async upsert(body, opts) {
        return supabaseFetch('/rest/v1/' + table, {
          method: 'POST',
          body: JSON.stringify(body),
          headers: { 'Prefer': 'resolution=merge-duplicates', 'Return': 'minimal' }
        });
      }
    };
  }
};

const supabaseReady = true;

// ── Auth Logic (OTP) ──
const authPage = document.getElementById('authPage');
const authEmail = document.getElementById('authEmail');
const authCode = document.getElementById('authCode');
const authError = document.getElementById('authError');
const authBtn = document.getElementById('authBtn');
const codeSection = document.getElementById('codeSection');
const resendHint = document.getElementById('resendHint');
const resendCountdown = document.getElementById('resendCountdown');

let authStep = 'email'; // 'email' | 'code'
let countdownTimer = null;
let currentUser = null;

function showAuthPage(){
  authStep = 'email';
  authEmail.value = '';
  authCode.value = '';
  authError.textContent = '';
  authBtn.textContent = '发送验证码';
  authBtn.disabled = false;
  codeSection.classList.add('hidden');
  resendHint.classList.add('hidden');
  clearInterval(countdownTimer);
  authPage.classList.remove('hidden');
  authEmail.focus();
}

function startCountdown(){
  let sec = 60;
  resendHint.classList.remove('hidden');
  resendCountdown.textContent = sec;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    sec--;
    resendCountdown.textContent = sec;
    if(sec <= 0){
      clearInterval(countdownTimer);
      resendHint.classList.add('hidden');
    }
  }, 1000);
}

authBtn.addEventListener('click', async function(){
  if(!supabaseReady){ authError.textContent = '网络加载失败，请刷新页面重试'; return; }
  const email = authEmail.value.trim();
  if(!email){ authError.textContent = '请输入邮箱地址'; return; }
  if(!email.includes('@')){ authError.textContent = '邮箱格式不正确'; return; }
  authError.textContent = '';

  if(authStep === 'email'){
    // Send OTP
    authBtn.disabled = true;
    authBtn.textContent = '发送中...';
    const {error} = await supabase.auth.signInWithOtp({email});
    if(error){
      authBtn.disabled = false;
      authBtn.textContent = '发送验证码';
      if(error.message.includes('rate')){
        authError.textContent = '发送太频繁，请稍后再试';
      } else {
        authError.textContent = error.message;
      }
      return;
    }
    authStep = 'code';
    authBtn.textContent = '验 证 登 录';
    authBtn.disabled = false;
    codeSection.classList.remove('hidden');
    authCode.focus();
    startCountdown();
    authError.style.color = 'var(--success)';
    authError.textContent = '验证码已发送，请查收邮件';
    authError.style.color = '#ef4444';
  } else {
    // Verify OTP
    const code = authCode.value.trim();
    if(!code || code.length < 8){ authError.textContent = '请输入8位验证码'; return; }
    authBtn.disabled = true;
    authBtn.textContent = '验证中...';
    const {data, error} = await supabase.auth.verifyOtp({email, token: code, type: 'email'});
    if(error){
      authBtn.disabled = false;
      authBtn.textContent = '验 证 登 录';
      authError.textContent = error.message;
      return;
    }
    // Login success
    currentUser = data.user;
    clearInterval(countdownTimer);
    await initAppAfterLogin();
    checkPasswordAndRender();
  }
});

// Re-send: click countdown to resend
resendHint.addEventListener('click', function(){
  if(resendCountdown.textContent !== '0') return;
  authStep = 'email';
  authBtn.textContent = '发送验证码';
  authBtn.disabled = false;
  codeSection.classList.add('hidden');
  resendHint.classList.add('hidden');
  authError.textContent = '';
});

async function initAppAfterLogin(){
  authPage.classList.add('hidden');
  // Load data from Supabase
  const {data, error} = await supabase.from('user_data').select('data').eq('user_id', currentUser.id).single();
  if(data && data.data){
    appData = {...{targetDeposit:1000000, checkins:{}, totalDeposit:0, streak:0, totalCount:0}, ...data.data};
  } else {
    appData = {targetDeposit:1000000, checkins:{}, totalDeposit:0, streak:0, totalCount:0};
  }
  // Also cache to localStorage for offline
  saveLocal();
}

async function syncToCloud(){
  if(!currentUser) return;
  await supabase.from('user_data').upsert({
    user_id: currentUser.id,
    data: appData,
    updated_at: new Date().toISOString()
  }, {onConflict: 'user_id'});
  saveLocal();
}

function saveLocal(){
  localStorage.setItem('nianzhiyue_data', JSON.stringify(appData));
}

// Logout
document.getElementById('logoutBtn').addEventListener('click', async function(){
  await supabase.auth.signOut();
  currentUser = null;
  appData = {targetDeposit:1000000, checkins:{}, totalDeposit:0, streak:0, totalCount:0};

let currentPage = 'home';

// ── Home Page ──
let settingsOpen = false;

function renderHome(){
  const now = new Date();
  const START_DATE = getStartDate();
  const TARGET_DATE = getEndDate();
  const totalMs = TARGET_DATE - START_DATE;
  const elapsedMs = now - START_DATE;
  const progress = Math.min(100, Math.max(0, (elapsedMs / totalMs) * 100));
  const diffMs = TARGET_DATE - now;
  const diffDays = Math.max(0, Math.floor(diffMs / 86400000));
  const diffHours = Math.max(0, Math.floor((diffMs % 86400000) / 3600000));
  const diffMins = Math.max(0, Math.floor((diffMs % 3600000) / 60000));
  const diffSecs = Math.max(0, Math.floor((diffMs % 60000) / 1000));
  const years = Math.floor(diffDays / 365);
  const months = Math.floor((diffDays % 365) / 30);
  const days = diffDays % 30;

  const endDateStr = settings.endYear+'.'+String(settings.endMonth).padStart(2,'0')+'.'+String(settings.endDay).padStart(2,'0');

  const bgStyle = settings.heroBgImage

  mainEl.innerHTML = `
    <div class="hero-card${settings.heroBgImage?' bg-image':''}" style="${bgStyle}">
      <button class="settings-trigger ${settingsOpen?'open':''}" id="settingsTrigger" title="自定义设置">⚙</button>

        <div class="countdown-item"><div class="countdown-num">${years}</div><div class="countdown-label">年</div></div>
        <div class="countdown-item"><div class="countdown-num">${months}</div><div class="countdown-label">月</div></div>
        <div class="countdown-item"><div class="countdown-num">${days}</div><div class="countdown-label">天</div></div>
        <div class="countdown-item"><div class="countdown-num">${String(diffHours).padStart(2,'0')}</div><div class="countdown-label">时</div></div>
        <div class="countdown-item"><div class="countdown-num">${String(diffMins).padStart(2,'0')}</div><div class="countdown-label">分</div></div>
        <div class="countdown-item"><div class="countdown-num">${String(diffSecs).padStart(2,'0')}</div><div class="countdown-label">秒</div></div>
      </div>
      <div class="hero-progress">
        <span style="font-size:12px">六年进度</span>
        <div class="hero-progress-bar"><div class="hero-progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
        <span class="hero-progress-text">${progress.toFixed(1)}%</span>
      </div>
    </div>

    <div class="settings-panel ${settingsOpen?'open':''}" id="settingsPanel">
      <div class="settings-title">⚙ 自定义设置</div>

function adjustColor(hex, amount){
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + amount));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
  const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
  return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function clearBgImage(){
  document.getElementById('setHeroBgImage').value = '';
}

function applyTheme(){
  const theme = settings.theme || 'auto';
  const html = document.documentElement;
  if(theme === 'auto'){
    html.removeAttribute('data-theme');
  } else {
    html.setAttribute('data-theme', theme);
  }
}

// ── Money Helpers ──
function calcTotalDeposit(){
  let total = appData.initialDeposit || 0;
  for(const [date, record] of Object.entries(appData.checkins)){
    total += (record.deposit || 0) - (record.expense || 0);
  }
  return total;
}
function formatMoneyFull(n){
  return '¥' + (n||0).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function submitCheckin(){
  const today = todayStr();
  const happy = document.getElementById('happyInput').value.trim();
  const tough = document.getElementById('toughInput').value.trim();
  const think = document.getElementById('thinkInput').value.trim();
  const deposit = parseInt(document.getElementById('depositInput').value) || 0;
  const expense = parseInt(document.getElementById('expenseInput').value) || 0;

  // Save initial deposit
  const initEl = document.getElementById('initialDepositInput');
  if(initEl) appData.initialDeposit = parseInt(initEl.value) || 0;

  appData.checkins[today] = {
    mood: checkinMood,
    happy,
    tough,
    think,
    deposit,
    expense,
    habits: {...checkinHabits},
    timestamp: Date.now()
  };

  appData.totalDeposit = calcTotalDeposit();
  appData.totalCount = Object.keys(appData.checkins).length;

  let streak = 0;
  const d = new Date();
  for(let i=0;i<1000;i++){
    const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(appData.checkins[s]){streak++}else break;
    d.setDate(d.getDate()-1);
  }
  appData.streak = streak;

  saveData(appData);
  showToast('✅ 打卡成功！','success');
  renderCheckin();
}

// ── Progress Page ──
function renderProgress(){
  const target = appData.targetDeposit;
  const current = calcTotalDeposit();
  const remaining = Math.max(0, target - current);
  const progressPct = Math.min(100, (current/target)*100);

  const now = new Date();
  const TARGET_DATE = getEndDate();
  const remainMs = TARGET_DATE - now;
  const remainMonths = Math.max(1, Math.ceil(remainMs / (30*86400000)));
  const suggestedMonthly = Math.ceil(remaining / remainMonths);

  const START_DATE = getStartDate();
  let heatmapCells = '';
  const hmStart = new Date(START_DATE);
  const hmEnd = new Date();
  const totalDays = Math.floor((hmEnd - hmStart) / 86400000) + 1;
  for(let i=0;i<totalDays;i++){
    const d = new Date(hmStart);
    d.setDate(d.getDate()+i);
    const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    let lvl = 0;
    if(appData.checkins[s]){
      const c = appData.checkins[s];
      const words = (c.happy||'').length+(c.tough||'').length+(c.think||'').length;
      if(words>300) lvl=4;
      else if(words>200) lvl=3;
      else if(words>100) lvl=2;
      else lvl=1;
    }
    heatmapCells += `<div class="heatmap-cell${lvl?' l'+lvl:''}" title="${s}${lvl?' · 已打卡':''}"></div>`;
  }

  let monthlyRows = '';
  const startMonth = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);
  const endMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const months = [];
  for(let m = new Date(endMonth); m >= startMonth; m.setMonth(m.getMonth()-1)){
    months.push(new Date(m));
  }
  for(const d of months){
    const yr = d.getFullYear();
    const mo = d.getMonth()+1;
    const daysInMonth = new Date(yr,mo,0).getDate();
    let checkedDays = 0;
    let monthNet = 0;
    for(let day=1;day<=daysInMonth;day++){
      const s = yr+'-'+String(mo).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      if(appData.checkins[s]){checkedDays++;monthNet += (appData.checkins[s].deposit||0)-(appData.checkins[s].expense||0)}
    }
    const rate = daysInMonth>0?Math.round(checkedDays/daysInMonth*100):0;
    monthlyRows += `<tr><td>${yr}-${String(mo).padStart(2,'0')}</td><td>${checkedDays}/${daysInMonth}</td><td>${rate}%</td><td>${formatMoneyFull(monthNet)}</td></tr>`;
  }

  mainEl.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="bp-title">💰 存款进度 · 目标</span>
        <button class="btn btn-sm btn-outline" onclick="adjustTarget()">⚙ 调整目标</button>
      </div>
      <div style="font-size:26px;font-weight:700;color:var(--brand-700);margin-top:8px">${formatMoneyFull(target)}</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" style="width:${progressPct}%"></div>
      </div>
      <div class="progress-stats">
        <div class="progress-stat"><div class="progress-stat-val">${formatMoneyFull(current)}</div><div class="progress-stat-lbl">当前存款</div></div>
        <div class="progress-stat"><div class="progress-stat-val">${formatMoneyFull(remaining)}</div><div class="progress-stat-lbl">距离目标</div></div>
        <div class="progress-stat"><div class="progress-stat-val">${formatMoneyFull(suggestedMonthly)}</div><div class="progress-stat-lbl">建议月存</div></div>
      </div>
    </div>

    <div class="card">
      <div class="bp-title">📅 打卡热力图</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">${hmStart.getFullYear()}/${hmStart.getMonth()+1}/${hmStart.getDate()} - ${hmEnd.getFullYear()}/${hmEnd.getMonth()+1}/${hmEnd.getDate()}</div>
      <div class="heatmap">${heatmapCells}</div>
      <div class="heatmap-legend">
        少 <span></span><span class="l1"></span><span class="l2"></span><span class="l3"></span><span class="l4"></span> 多
      </div>
    </div>

    <div class="card">
      <div class="bp-title">📊 月度统计</div>
      <div style="overflow-x:auto;margin-top:10px">
        <table class="data-table">
          <thead><tr><th>月份</th><th>打卡天数</th><th>打卡率</th><th>月末存款</th></tr></thead>
          <tbody>${monthlyRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

  const val = prompt('请输入新的存款目标金额：', appData.targetDeposit);

        <select class="filter-select" id="monthFilter">
          <option value="all" ${diaryFilter.month==='all'?'selected':''}>全部月份</option>
          ${allMonths.map(m=>`<option value="${m}" ${diaryFilter.month===m?'selected':''}>${m}</option>`).join('')}
        </select>
        <button class="btn btn-sm btn-outline" onclick="exportData()">📤 导出数据</button>
      </div>
    </div>

    ${filtered.length===0?`
      <div class="card">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">还没有打卡记录，快去打卡吧</div>
        </div>
      </div>
    `:filtered.map(([date,data])=>`
      <div class="diary-card" onclick="viewDiaryDetail('${date}')">
        <div class="diary-card-header">
          <span class="diary-date">${date}</span>
          <span class="diary-mood">${moodEmojis[data.mood]||'😐'}</span>
        </div>
        <div class="diary-deposit">📥 ${formatMoneyFull(data.deposit||0)} ${data.expense?`📤 ${formatMoneyFull(data.expense)}`:'📤 ¥0'} | 净存 ${formatMoneyFull((data.deposit||0)-(data.expense||0))}</div>
        <div class="diary-tags">
          ${data.happy?'<span class="diary-tag">🌟 开心事</span>':''}
          ${data.tough?'<span class="diary-tag">💪 挑战</span>':''}
          ${data.think?'<span class="diary-tag">💭 思考</span>':''}
          ${data.habits.sport?'<span class="diary-tag">🏃 运动</span>':''}
          ${data.habits.study?'<span class="diary-tag">📚 学习</span>':''}
        </div>
      </div>
    `).join('')}
  `;

  document.getElementById('diarySearch').addEventListener('input',function(){
    diaryFilter.search = this.value;
    renderDiary();
  });
  document.getElementById('moodFilter').addEventListener('change',function(){
    diaryFilter.mood = this.value;
    renderDiary();
  });
  document.getElementById('monthFilter').addEventListener('change',function(){
    diaryFilter.month = this.value;
    renderDiary();
  });
}

function viewDiaryDetail(date){
  const data = appData.checkins[date];
  if(!data) return;
  const moodLabels = {'1':'😄 超棒','2':'😊 不错','3':'😐 一般','4':'😔 不太好','5':'😢 难过'};
  mainEl.innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
        <button class="btn btn-sm btn-outline" onclick="renderDiary()">← 返回列表</button>
        <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none" onclick="deleteCheckin('${date}')">🗑 删除此条</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:18px;font-weight:700">${date}</span>
        <span style="font-size:24px">${moodLabels[data.mood]||'😐'}</span>
      </div>
      <div style="margin-top:14px">💰 今日存款：<strong>${formatMoneyFull(data.deposit||0)}</strong> | 今日花销：<strong>${formatMoneyFull(data.expense||0)}</strong> | 净存：<strong>${formatMoneyFull((data.deposit||0)-(data.expense||0))}</strong></div>
      ${data.happy?`<div style="margin-top:14px"><div class="form-label">🌟 一件开心/积极的事</div><p style="font-size:14px;color:var(--text-primary);line-height:1.8">${escapeHtml(data.happy)}</p></div>`:''}
      ${data.tough?`<div style="margin-top:14px"><div class="form-label">💪 一件难过/挑战的事</div><p style="font-size:14px;color:var(--text-primary);line-height:1.8">${escapeHtml(data.tough)}</p></div>`:''}
      ${data.think?`<div style="margin-top:14px"><div class="form-label">💭 今日思考</div><p style="font-size:14px;color:var(--text-primary);line-height:1.8">${escapeHtml(data.think)}</p></div>`:''}
      <div style="margin-top:14px">
        <div class="form-label">✅ 今日习惯</div>
        <div class="habit-group">
          <span class="habit-chip ${data.habits.sport?'checked':''}" style="pointer-events:none">🏃 运动了</span>
          <span class="habit-chip ${data.habits.study?'checked':''}" style="pointer-events:none">📚 学习了</span>
        </div>
      </div>
    </div>
  `;
}

function deleteCheckin(date){
  if(!confirm('确定删除 '+date+' 的打卡记录吗？此操作不可恢复。')) return;
  delete appData.checkins[date];
  appData.totalDeposit = calcTotalDeposit();
  appData.totalCount = Object.keys(appData.checkins).length;
  let streak = 0;
  const d = new Date();
  for(let i=0;i<1000;i++){
    const s = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(appData.checkins[s]){streak++}else break;
    d.setDate(d.getDate()-1);
  }
  appData.streak = streak;
  saveData(appData);
  showToast('已删除 '+date,'success');
  renderDiary();
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function exportData(){
  const json = JSON.stringify(appData,null,2);
  const blob = new Blob([json],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '年之约_打卡数据_'+todayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出','success');
}

// ── Blueprint Page ──
function renderBlueprint(){
  const START_DATE = getStartDate();
  const startDate = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), 1);
  let cells = '';
  const today = todayStr();

  for(let i=1;i<=72;i++){
    const monthDate = new Date(startDate);
    monthDate.setMonth(monthDate.getMonth()+i-1);
    const mStr = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0');
    const isCurrentMonth = today.startsWith(mStr);
    const isFuture = monthDate > new Date();

    let status = '', rate = '';
    if(isFuture){status='待开启'}
    else if(isCurrentMonth){
      const daysInMonth = new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
      let cnt = 0;
      for(let d=1;d<=daysInMonth;d++){
        const s = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(appData.checkins[s]) cnt++;
      }
      const pct = Math.round(cnt/daysInMonth*100);
      status = cnt+'天打卡';
      rate = pct+'%';
    } else {
      const daysInMonth = new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
      let cnt = 0;
      for(let d=1;d<=daysInMonth;d++){
        const s = monthDate.getFullYear()+'-'+String(monthDate.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(appData.checkins[s]) cnt++;
      }
      const pct = Math.round(cnt/daysInMonth*100);
      status = cnt+'天打卡';
      rate = pct+'%';
    }

    cells += `
      <div class="bp-cell ${isCurrentMonth?'current':''} ${isFuture?'future':''}" title="M${i} · ${monthDate.getFullYear()}.${String(monthDate.getMonth()+1).padStart(2,'0')}">
        <div class="bp-month">M${i}</div>
        <div class="bp-date">${monthDate.getFullYear()}.${String(monthDate.getMonth()+1).padStart(2,'0')}</div>
        <div class="bp-status">${status}</div>
        ${rate?`<div class="bp-rate">${rate}</div>`:''}
      </div>
    `;
  }

  mainEl.innerHTML = `
    <div class="card">
      <div class="bp-header">
        <div>
          <div class="bp-title">📅 72个月 · 六年蓝图</div>
          <div class="bp-subtitle">每个格子代表一个月</div>
        </div>
      </div>
      <div class="bp-grid">${cells}</div>
    </div>
  `;
}

// ── Init ──

// Apply theme
applyTheme();

// Theme toggle button
document.getElementById('themeToggle').addEventListener('click',()=>{
  const themes = ['auto', 'light', 'dark'];
  const icons = ['🌓', '☀️', '🌙'];
  const current = settings.theme || 'auto';
  const idx = themes.indexOf(current);
  const next = themes[(idx + 1) % 3];
  settings.theme = next;
  saveSettings(settings);
  applyTheme();
  document.getElementById('themeToggle').textContent = icons[(idx + 1) % 3];
  showToast(next==='auto'?'已切换为跟随系统':next==='light'?'已切换为浅色模式':'已切换为深色模式','success');
});
// Set initial theme icon
(function(){
  const icons = {'auto':'🌓','light':'☀️','dark':'🌙'};
  document.getElementById('themeToggle').textContent = icons[settings.theme||'auto'];
})();

// Password lock - called after auth
function checkPasswordAndRender(){
  if(settings.passwordEnabled && settings.password && !sessionStorage.getItem('nianzhiyue_unlocked')){
    const overlay = document.getElementById('pwOverlay');
    const pwInput = document.getElementById('pwInput');
    const pwError = document.getElementById('pwError');
    overlay.classList.remove('hidden');

    function tryUnlock(){
      if(pwInput.value === settings.password){
        sessionStorage.setItem('nianzhiyue_unlocked', '1');
        overlay.classList.add('hidden');
        renderHome();
      } else {
        pwError.textContent = '密码错误，请重试';
        pwInput.value = '';
        pwInput.focus();
      }
    }

    document.getElementById('pwSubmitBtn').addEventListener('click', tryUnlock);
    pwInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter') tryUnlock();
    });
    pwInput.focus();
  } else {
    renderHome();
  }
}

// ── Init ──
(async function init(){
  if(!supabaseReady){ showAuthPage(); return; }
  const {data: {session}} = await supabase.auth.getSession();
  if(session){
    currentUser = session.user;
    await initAppAfterLogin();
    checkPasswordAndRender();
  } else {
    showAuthPage();
  }
})();

setInterval(()=>{
  if(currentPage==='home') renderHome();
},1000);
</script>
